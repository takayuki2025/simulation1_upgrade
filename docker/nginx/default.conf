server {
listen 80;
server_name localhost;

# Laravel の public ディレクトリをルートに設定
root /var/www/backend/public;

proxy_read_timeout 300;
proxy_send_timeout 300;

# ===========================================================
# 1. 物理ストレージ (画像など) - Nginxが直接レスポンスするためCORS設定を残す
# ===========================================================
location /storage/ {
    alias /var/www/backend/storage/app/public/;
    add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Auth-Token, Origin, Authorization' always;
    add_header 'Access-Control-Max-Age' 1728000 always;
}

# ===========================================================
# 2. PHP ファイル実行 (Laravel用) - 完全に削除
# ===========================================================
location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_ACCEPT "application/json";
    fastcgi_connect_timeout 5s;
    fastcgi_intercept_errors on;
    # ここからすべての add_header ディレクティブを削除
}

# ===========================================================
# 3. API (Laravelルーティング用)
# ===========================================================
location ^~ /api/ {
    # Preflight (OPTIONS) はNginxで処理し、ヘッダーを付与
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Auth-Token, Origin, Authorization' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        return 204;
    }

    # Laravelのindex.phpに強制ルーティング (Nginxはヘッダーを追加しない)
    include fastcgi_params;
    fastcgi_pass php:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param PATH_INFO $uri;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param HTTP_ACCEPT "application/json";

    fastcgi_intercept_errors on;
    # ここからすべての add_header ディレクティブを削除
}

# ===========================================================
# 4. Nuxt (フロントエンド) - 完全に削除
# ===========================================================
location / {
    try_files $uri $uri/ @nuxt;
    # ここからすべての add_header ディレクティブを削除
}

location @nuxt {
    proxy_pass http://frontend_dev:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ===========================================================
# 5. Laravel エラーハンドラ
# ===========================================================
location @laravel_error_handler {
    internal;
    default_type application/json;
    return 500 '{"error_type": "Nginx_FastCGI_Error", "status": 500, "message": "Backend application error (PHP/Laravel)."}';
}


}