# ====================================================
# 1. HTTP Server Block (http://laravel.test)
# ====================================================
server {
    listen 80;
    server_name localhost laravel.test;

    # HTTPSにリダイレクト (HSTS適用前に安全を確保)
    return 301 https://$host$request_uri;
}

# ====================================================
# 2. HTTPS Server Block (https://laravel.test)
# ====================================================
server {
    listen 443 ssl http2;
    server_name localhost laravel.test;

    # ドキュメントルートの設定
    root /var/www/backend/public;
    index index.php index.html;

    # 最大ボディサイズ
    client_max_body_size 10m;

    # ------------------------------------------------
    # SSL/TLS Configuration (mkcert)
    # ------------------------------------------------
    ssl_certificate /etc/nginx/ssl/laravel.test.crt;
    ssl_certificate_key /etc/nginx/ssl/laravel.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # ------------------------------------------------
    # Aliases
    # ------------------------------------------------
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        expires 30d;
    }

    # ================================================
    # 🔥 最終修正: Laravel Routing + CORS (if/add_headerを location に統合) 🔥
    # ================================================

    location / {
        # 1. OPTIONSリクエストの処理（プリフライト）
        if ($request_method = 'OPTIONS') {
            # CORSヘッダーを付与
            add_header 'Access-Control-Allow-Origin' 'https://localhost:3000' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Firebase-Token' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000 always;
            # プリフライトリクエストには204を返して終了
            return 204;
        }

        # 2. 通常リクエスト（GET/POSTなど）の処理
        # FastCGIレスポンスにもヘッダーを強制適用
        add_header 'Access-Control-Allow-Origin' 'https://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, X-Firebase-Token' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # ファイルまたはディレクトリが存在しない場合、index.phpにルーティングを渡す (Laravelのメインルーティング)
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ------------------------------------------------
    # PHP Processing (FastCGI)
    # ------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass php:9000; # PHP-FPMコンテナ名とポート
        fastcgi_index index.php;

        # 標準のFastCGIパラメータをインクルード
        include fastcgi_params;

        # SCRIPT_FILENAME は、include の後にドキュメントルートを正しく設定
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # ★ Authorization ヘッダー伝播の強化（ここには残す） ★
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param Authorization $http_authorization;

        # Laravelがセキュア接続として認識するために必須
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        # 接続と読み取りのタイムアウト設定
        fastcgi_connect_timeout 300s;
        fastcgi_read_timeout 700s;
    }

    # ------------------------------------------------
    # Error Handling (Optional internal handler for debugging)
    # ------------------------------------------------
    # location @laravel_error_handler {
    #     internal;
    #     default_type application/json;
    #     return 500 '{"error_type": "Nginx_FastCGI_Error", "status": 500, "message": "Backend application error (PHP/Laravel)."}';
    # }
    # proxy timeoutを削除し、FastCGI timeoutに統一
}