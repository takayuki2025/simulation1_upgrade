server {
    listen 80;
    server_name localhost laravel.test;

    root /var/www/backend/public;
    index index.php index.html;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ===========================================================
    # 1. 静的ファイル（画像など）
    # ===========================================================
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        # CORSヘッダはLaravelが出すので不要
    }

    # ===========================================================
    # 2. PHP (FastCGI)
    # ===========================================================
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_ACCEPT "application/json";
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_connect_timeout 50s;
        fastcgi_read_timeout 300s;
        fastcgi_intercept_errors on;
    }

    # ===========================================================
    # 3. Laravelルーティング (API, Auth, Webのすべてをここで処理)
    # ===========================================================
    location / {
        # 🚫 CORSはLaravelに任せる。ヘッダもプリフライト即返却も削除。
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===========================================================
    # 4. Laravelエラーハンドラ (旧セクション5)
    # ===========================================================
    location @laravel_error_handler {
        internal;
        default_type application/json;
        return 500 '{"error_type": "Nginx_FastCGI_Error", "status": 500, "message": "Backend application error (PHP/Laravel)."}';
    }
}