    # ====================================================
    # 1. HTTP Server Block (http://laravel.test)
    # ====================================================
    server {
        listen 80;
        server_name localhost laravel.test;
        return 301 https://$host$request_uri;
    }

    # ====================================================
    # 2. HTTPS Server Block (https://laravel.test)
    # ====================================================
    server {
        listen 443 ssl;
        server_name localhost laravel.test;

        client_max_body_size 10m;

        root /var/www/backend/public;
        index index.php index.html;

        ssl_certificate /etc/nginx/ssl/laravel.test.crt;
        ssl_certificate_key /etc/nginx/ssl/laravel.test.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        proxy_read_timeout 700s;
        proxy_send_timeout 700s;

        location /storage/ {
            alias /var/www/backend/storage/app/public/;
        }

        location ~ \.php$ {
            # include fastcgi_params;  <-- ★削除: 外部ファイル依存を排除
            
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            
            # ★★★ FastCGIパラメータをすべて直接記述 (確実に渡すため) ★★★
            fastcgi_param QUERY_STRING $query_string;
            fastcgi_param REQUEST_METHOD $request_method;
            fastcgi_param CONTENT_TYPE $content_type;
            fastcgi_param CONTENT_LENGTH $content_length;
            
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_param DOCUMENT_URI $document_uri;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_param SERVER_PROTOCOL $server_protocol;
            
            fastcgi_param GATEWAY_INTERFACE CGI/1.1;
            fastcgi_param SERVER_SOFTWARE nginx/$nginx_version;
            
            fastcgi_param REMOTE_ADDR $remote_addr;
            fastcgi_param REMOTE_PORT $remote_port;
            fastcgi_param SERVER_ADDR $server_addr;
            fastcgi_param SERVER_PORT $server_port;
            fastcgi_param SERVER_NAME $server_name;
            
            fastcgi_param HTTPS on;
            
            # ★★★ 修正: 変数 $http_authorization に戻す ★★★
            fastcgi_param HTTP_AUTHORIZATION $http_authorization; 
            fastcgi_param AUTHORIZATION $http_authorization;
            
            # 追加設定
            fastcgi_param HTTP_X_FORWARDED_PROTO https; 
            fastcgi_connect_timeout 300s;
            fastcgi_read_timeout 700s;
            fastcgi_intercept_errors on;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location @laravel_error_handler {
            internal;
            default_type application/json;
            return 500 '{"error_type": "Nginx_FastCGI_Error", "status": 500, "message": "Backend application error (PHP/Laravel)."}';
        }
    }
