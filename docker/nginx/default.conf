# ============================================================
# 🔐 Laravel + Sanctum + Next.js (HTTPS, Cookie対応) 専用設定
# ============================================================

# -------------------------
# 1. HTTP → HTTPS リダイレクト
# -------------------------
server {
    listen 80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

# -------------------------
# 2. HTTPS (9000)
# -------------------------
server {
    listen 9000 ssl http2;
    server_name localhost;

    # Laravel public
    root /var/www/backend/public;
    index index.php index.html;

    client_max_body_size 10m;

    # ======================================================
    # SSL（mkcert）
    # ======================================================
    ssl_certificate     /etc/nginx/ssl/localhost+2.pem;
    ssl_certificate_key /etc/nginx/ssl/localhost+2-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # ======================================================
    # 🔥 修正箇所 1: CORS ヘッダーを location / の最上部に移動・統一
    # これにより、FastCGIを通るレスポンスや OPTIONS 応答にヘッダーが確実に付与される
    # ======================================================
    location / {
        # --- Preflight Request (OPTIONS) ---
        if ($request_method = 'OPTIONS') {
            # OPTIONS処理に必要なヘッダー
            add_header Access-Control-Allow-Origin "https://localhost:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Firebase-Token, X-XSRF-TOKEN" always;
            add_header Access-Control-Max-Age 1728000 always;
            return 204;
        }

        # --- 通常リクエストのレスポンスに強制的にヘッダーを追加 ---
        # Sanctum認証失敗時(401)などの非200レスポンスにもヘッダーを付与するため必須
        add_header Access-Control-Allow-Origin "https://localhost:3000" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Firebase-Token, X-XSRF-TOKEN" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        
        # Laravelルーティング
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ======================================================
    # PHP（FastCGI）処理
    # ★★★ Cookie 壊さないように add_header はここから削除 ★★★
    # ======================================================
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Laravel に HTTPS 通知
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        # Cookie を正しく Laravel へ渡す
        fastcgi_param HTTP_COOKIE $http_cookie;

        # ---------------------------------------------
        # 🔥 修正箇所 2: ここにあった add_header は全て削除！
        # location / で一元管理されているため不要
        # ---------------------------------------------

        fastcgi_connect_timeout 300s;
        fastcgi_read_timeout 700s;
    }

    # ======================================================
    # Storage（public/storage）
    # ======================================================
    location /storage/ {
        alias /var/www/backend/public/storage/;
        try_files $uri $uri/ =404;

        # 画像は CORS 許可（Cookie 不要なので * でOK）
        add_header Access-Control-Allow-Origin "*";
        expires 30d;
        
        # 💡 Storage にも Next.js からアクセスする場合は Allow-Credentials が必要になる場合があるため残す
        # add_header Access-Control-Allow-Origin "https://localhost:3000" always;
        # add_header Access-Control-Allow-Credentials "true" always;
    }
}