# ----------------------------------------------------
# 1. HTTP Server Block (http://laravel.test)
# ----------------------------------------------------
server {
    listen 80;
    server_name localhost laravel.test;

    # HTTPSにリダイレクト (開発環境ではコメントアウトしてもOK)
    return 301 https://$host$request_uri;

    client_max_body_size 10m;

    root /var/www/backend/public;
    index index.php index.html;

    proxy_read_timeout 700s;
    proxy_send_timeout 700s;

    location /storage/ {
        alias /var/www/backend/storage/app/public/;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_ACCEPT "application/json";
        fastcgi_param HTTPS off; # HTTPなのでoff
        fastcgi_param HTTP_X_FORWARDED_PROTO http; # HTTPなのでhttp
        fastcgi_connect_timeout 300s;
        fastcgi_read_timeout 700s;
        fastcgi_intercept_errors on;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location @laravel_error_handler {
        internal;
        default_type application/json;
        return 500 '{"error_type": "Nginx_FastCGI_Error", "status": 500, "message": "Backend application error (PHP/Laravel)."}';
    }
}

# ----------------------------------------------------
# 2. HTTPS Server Block (https://laravel.test)
# ----------------------------------------------------
server {
    listen 443 ssl;
    server_name localhost laravel.test;

    client_max_body_size 10m;

    root /var/www/backend/public;
    index index.php index.html;

    # ★ 自己署名証明書の設定
    ssl_certificate /etc/nginx/ssl/laravel.test.crt;
    ssl_certificate_key /etc/nginx/ssl/laravel.test.key;

    # 推奨されるSSL設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    proxy_read_timeout 700s;
    proxy_send_timeout 700s;

    location /storage/ {
        alias /var/www/backend/storage/app/public/;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_ACCEPT "application/json";
        fastcgi_param HTTPS on; # HTTPSなのでon
        fastcgi_param HTTP_X_FORWARDED_PROTO https; # HTTPSなのでhttps
        fastcgi_connect_timeout 300s;
        fastcgi_read_timeout 700s;
        fastcgi_intercept_errors on;
    }

    # ===========================================================
    # 3. Laravelルーティング (API, Auth, Webのすべてをここで処理)
    # ===========================================================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ===========================================================
    # 4. Laravelエラーハンドラ (旧セクション5)
    # ===========================================================
    location @laravel_error_handler {
        internal;
        default_type application/json;
        return 500 '{"error_type": "Nginx_FastCGI_Error", "status": 500, "message": "Backend application error (PHP/Laravel)."}';
    }
}