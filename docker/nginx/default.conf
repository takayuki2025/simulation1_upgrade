# ====================================================
# 1. HTTP Server Block (http://laravel.test)
# ====================================================
server {
    listen 80;
    server_name localhost laravel.test;

    # HTTPSにリダイレクト (HSTS適用前に安全を確保)
    return 301 https://$host$request_uri;
}

# ====================================================
# 2. HTTPS Server Block (https://laravel.test)
# ====================================================
server {
    listen 443 ssl http2;
    server_name localhost laravel.test;

    # ドキュメントルートの設定
    root /var/www/backend/public;
    index index.php index.html;

    # 最大ボディサイズ
    client_max_body_size 10m;

    # ------------------------------------------------
    # SSL/TLS Configuration (mkcert)
    # ------------------------------------------------
    # mkcertで生成された証明書パスを指定します。
    # (環境に応じてパスを調整してください)
    ssl_certificate /etc/nginx/ssl/laravel.test.crt;
    ssl_certificate_key /etc/nginx/ssl/laravel.test.key;

    # 推奨されるプロトコルと暗号スイート
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;

    # ------------------------------------------------
    # Aliases
    # ------------------------------------------------
    # Laravelのシンボリックリンク (/public/storage -> /storage/app/public) の設定
    location /storage/ {
        alias /var/www/backend/storage/app/public/;
        expires 30d;
    }

    # ------------------------------------------------
    # PHP Processing (FastCGI)
    # ------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass php:9000; # PHP-FPMコンテナ名とポート
        fastcgi_index index.php;

        # 標準のFastCGIパラメータをインクルード (通常 fastcgi_params を使用)
        include fastcgi_params;  
        
        # SCRIPT_FILENAME は、include の後にドキュメントルートを正しく設定
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Laravel認証(Sanctum/Passport等)のためにHTTP_AUTHORIZATIONヘッダーを渡す (必須)
        fastcgi_param HTTP_AUTHORIZATION $http_authorization; 

        # Laravelがセキュア接続として認識するために必須
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https; 

        # 接続と読み取りのタイムアウト設定
        fastcgi_connect_timeout 300s;
        fastcgi_read_timeout 700s;
    }

    # ------------------------------------------------
    # Laravel Routing
    # ------------------------------------------------
    location / {
        # ファイルまたはディレクトリが存在しない場合、index.phpにルーティングを渡す
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ------------------------------------------------
    # Error Handling (Optional internal handler for debugging)
    # ------------------------------------------------
    # location @laravel_error_handler {
    #     internal;
    #     default_type application/json;
    #     return 500 '{"error_type": "Nginx_FastCGI_Error", "status": 500, "message": "Backend application error (PHP/Laravel)."}';
    # }
    # proxy timeoutを削除し、FastCGI timeoutに統一
}