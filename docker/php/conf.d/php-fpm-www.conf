; [www]プールに対して、競合のないシンプルな設定を定義します。
[www]

; ユーザーとグループ
user = www-data
group = www-data

; TCPポート 0.0.0.0:9000 で全インターフェースからリッスン
listen = 0.0.0.0:9000
listen.mode = 0666

; プロセス管理を dynamic に設定（Docker環境の一般的な設定）
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; ワーカプロセスの stdout/stderr を FPMのログに出力
catch_workers_output = yes