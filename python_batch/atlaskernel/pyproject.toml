[project]
name = "atlaskernel"
version = "0.1.0"
description = "AtlasKernel - Entity Analysis Engine (MVP)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "rapidfuzz>=3.6",
  "jsonschema>=4.23"
]

[project.scripts]
atlaskernel = "atlaskernel.cli:main"

[tool.setuptools.package-data]
atlaskernel = ["assets/*.txt"]