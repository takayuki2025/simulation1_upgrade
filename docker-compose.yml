version: '3.8' # ★ 必須！ファイルの1行目、インデントなし

services:

  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    ports:
      - "80:80"   # HTTPをホストに公開
      - "443:443" # HTTPSをホストに公開
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/backend
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./backend/public:/var/www/backend/public
    depends_on:
      php:
        condition: service_healthy
    networks:
      simulation1_network:
        ipv4_address: 172.22.0.2

  php:
    build: ./docker/php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./backend/public:/var/www/backend/public
      - ./docker/php/conf.d/mailhog.ini:/usr/local/etc/php/conf.d/mailhog.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
      # ★★★ 追記: Supervisor設定ファイルのマウント ★★★
      # サービス設定ファイル (キューワーカーの設定)
      - ./docker/supervisor/laravel-worker.conf:/etc/supervisor/conf.d/laravel-worker.conf:ro
      # メイン設定ファイル (php-fpmも管理下に置くための設定)
      - ./docker/supervisor/supervisord.conf:/etc/supervisord.conf:ro

    # ★★★ CRITICAL FIX: コマンドをSupervisor起動に変更 ★★★
    entrypoint: /bin/sh -c
    command: >
      "chmod -R 777 /var/www/backend/storage /var/www/backend/bootstrap/cache || true && /usr/bin/supervisord -c /etc/supervisord.conf"
    environment:
      - APP_URL=https://laravel.test
    depends_on:
      - mysql
    networks:
      simulation1_network:
        ipv4_address: 172.22.0.3
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      simulation1_network:
        ipv4_address: 172.22.0.4

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=172.22.0.4
      - PMA_USER=laravel_user
      - PMA_PASSWORD=laravel_pass
    depends_on:
      - mysql
    ports:
      - 8080:80
    networks:
      simulation1_network:
        ipv4_address: 172.22.0.5

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    restart: always
    ports:
      - "8025:8025" # MailHog Web UI
      - "1025:1025" # SMTPサーバー
    networks:
      simulation1_network:
        ipv4_address: 172.22.0.6

  frontend_dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_dev
    ports:
      - "3000:3000" # ★ Next.js 標準ポート

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./ssl_certs:/app/ssl_certs
    working_dir: /app
    environment:
      # - CHOKIDAR_USEPOLLING=true. メモリ高騰の主因の可能性ありのため削除
      - NEXT_PUBLIC_API_BASE_URL=https://laravel.test
    networks:
      simulation1_network:
        ipv4_address: 172.22.0.7
    # ★★★ 追記: メモリ上限と再起動ポリシーの設定 ★★★
    # メモリ不足になったら自動でコンテナを再起動する設定 (Docker Swarmモードで使用されますが、
    # Docker Composeではリソース制限として機能します)
    # ★★★ 追記: Next.js の起動コマンドを明示し、Node.jsのメモリを制限 ★★★
    command: sh -c "node --max-old-space-size=3072 start-https.js"
    # deploy セクションは上記 1. の修正 (memory: 3072M) を反映すること
    deploy:
      resources:
        limits:
          memory: 3072M
        reservations:
          memory: 512M


networks:
  simulation1_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

volumes:
  mysql_data: ~
  caddy_data: {}
  caddy_config: {}