version: '3.8' # ★ 必須！ファイルの1行目、インデントなし

services:

  # 🚨 Caddyサービスを完全に削除しました。
  # caddy: ...

  nginx:
    # image: nginx:1.21.1  <-- 汎用イメージからビルドに変更
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile # ★ Nginx専用のDockerfileを使用
    ports:
      - "80:80"   # HTTPをホストに公開
      - "443:443" # HTTPSをホストに公開
    volumes:
      # Nginxがビルド成果物を内部でコピーするため、ソースコードのマウントは不要（削除）
      # - ./frontend:/var/www/frontend # <-- この行を削除
      - ./backend:/var/www/backend  # Laravelのソースコードは引き続きマウント
      # ★ 追加: mkcert証明書をマウント
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      # ★★★ 修正: ./public ではなく ./backend/public をマウント ★★★
      - ./backend/public:/var/www/backend/public
    depends_on:
      php:
        condition: service_healthy # PHPサービスがHealthyになるまで待機
    networks:
      simulation1_network: # ネットワークをオブジェクト形式に変更
        ipv4_address: 172.22.0.2 # ★ 固定IPを割り当て

  php:
    build: ./docker/php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend  # Laravel
      # ★★★ 修正: ./public ではなく ./backend/public をマウント ★★★
      - ./backend/public:/var/www/backend/public
      - ./docker/php/conf.d/mailhog.ini:/usr/local/etc/php/conf.d/mailhog.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
    # ★★★ CRITICAL FIX: Laravel実行に必要な権限をPHPコンテナ起動時に付与 ★★★
    entrypoint: /bin/sh -c
    command: >
      "chmod -R 777 /var/www/backend/storage /var/www/backend/bootstrap/cache || true && php-fpm"
    environment:
      - APP_URL=https://laravel.test # Caddy削除に伴い、ポート番号を削除
    depends_on:
      - mysql
    networks:
      simulation1_network: # ネットワークをオブジェクト形式に変更
        ipv4_address: 172.22.0.3 # ★ 固定IPを割り当て
    healthcheck:
      test: ["CMD", "php-fpm", "-t"] # PHP-FPMの設定テスト
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s # サービス起動後、この期間はヘルスチェックの失敗を許容

  mysql:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      simulation1_network: # ネットワークをオブジェクト形式に変更
        ipv4_address: 172.22.0.4 # ★ 固定IPを割り当て (最も重要)

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=172.22.0.4 # ★ PMA_HOSTを固定IPに変更
      - PMA_USER=laravel_user
      - PMA_PASSWORD=laravel_pass
    depends_on:
      - mysql
    ports:
      - 8080:80
    networks:
      simulation1_network: # ネットワークをオブジェクト形式に変更
        ipv4_address: 172.22.0.5 # ★ 固定IPを割り当て

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    restart: always
    ports:
      - "8025:8025" # MailHog Web UI
      - "1025:1025" # SMTPサーバー
    networks:
      simulation1_network: # ネットワークをオブジェクト形式に変更
        ipv4_address: 172.22.0.6 # ★ 固定IPを割り当て

  frontend_dev:
    build: # ★ buildの直下に contextとdockerfileをネスト
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_dev
    ports:
      - "3000:3000" # ★ Next.js 標準ポート

    volumes:
      - ./frontend:/app
      - /app/node_modules
      #- ./docker/nginx/ssl:/certs # ★ 修正: SSLディレクトリを /certs にマウント
      # ★★★ 修正: ファイルではなく、ディレクトリ全体をマウントする ★★★
      - ./ssl_certs:/app/ssl_certs  # /app/ssl_certs にディレクトリごとマウント
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      # 🚨 修正: ここで NEXT_PUBLIC_API_BASE_URL を明示的に設定
      - NEXT_PUBLIC_API_BASE_URL=https://laravel.test # ← ルートの.envの内容をコピー
    networks:
      simulation1_network:
        ipv4_address: 172.22.0.7

# ★ ネットワーク定義にIPアドレスのレンジ(サブネット)を追記
networks:
  simulation1_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

volumes:
  mysql_data: ~
  caddy_data: {}
  caddy_config: