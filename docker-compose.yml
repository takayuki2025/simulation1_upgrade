services:

  caddy:
    image: caddy:2.7.5-alpine
    restart: unless-stopped
    ports:
      # 標準のHTTP/HTTPSポートを公開
      - "80:80"
      - "4430:4430"
      - "4431:4431"  # ★ Nuxt (新規追加)
    volumes:
      # Caddyの設定ファイル
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/caddy/laravel.test.pem:/etc/caddy/laravel.test.pem:ro
      - ./docker/caddy/laravel.test-key.pem:/etc/caddy/laravel.test-key.pem:ro
      # Caddyが生成するSSL証明書とキーを保存
      - caddy_data:/data
    networks:
      simulation1_network:
        ipv4_address: 172.22.0.9 # 新しい固定IPを割り当て
    depends_on:
      - nginx # Nginxが起動してからCaddyを起動

  nginx:
    # image: nginx:1.21.1  <-- 汎用イメージからビルドに変更
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile # ★ Nginx専用のDockerfileを使用
    # ports:
    #   - "8000:80"
    volumes:
      # Nginxがビルド成果物を内部でコピーするため、ソースコードのマウントは不要（削除）
      # - ./frontend:/var/www/frontend # <-- この行を削除
      - ./backend:/var/www/backend  # Laravelのソースコードは引き続きマウント
      # Nginx設定ファイルはDocker build時にコピーされるため、ボリュームマウントは不要（削除）
      # - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf # <-- この行を削除
    depends_on:
      - php
      # - frontend_builder # ★ ビルドサービスを削除したため、依存関係も削除
    networks:
      simulation1_network: # ネットワークをオブジェクト形式に変更
        ipv4_address: 172.22.0.2 # ★ 固定IPを割り当て

  php:
    build: ./docker/php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend  # Laravel
      - ./docker/php/conf.d/mailhog.ini:/usr/local/etc/php/conf.d/mailhog.ini
      # 🚨 【削除】 Nuxt/SSR関連のボリュームマウントを全て削除
      # ----------------------------------------------------
    # ★★★ 修正箇所: PHP-FPMポートを公開（接続テストのため一時的に維持） ★★★
    ports:
      - "9000:9000"
    # ----------------------------------------------------
    environment:
      - APP_URL=https://laravel.test:4430
    depends_on:
      - mysql
    networks:
      simulation1_network: # ネットワークをオブジェクト形式に変更
        ipv4_address: 172.22.0.3 # ★ 固定IPを割り当て
    healthcheck:
      test: ["CMD", "php-fpm", "-t"] # PHP-FPMの設定テスト
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.3
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: laravel_pass
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      simulation1_network: # ネットワークをオブジェクト形式に変更
        ipv4_address: 172.22.0.4 # ★ 固定IPを割り当て (最も重要)

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=172.22.0.4 # ★ PMA_HOSTを固定IPに変更
      - PMA_USER=laravel_user
      - PMA_PASSWORD=laravel_pass
    depends_on:
      - mysql
    ports:
      - 8080:80
    networks:
      simulation1_network: # ネットワークをオブジェクト形式に変更
        ipv4_address: 172.22.0.5 # ★ 固定IPを割り当て

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    restart: always
    ports:
      - "8025:8025" # MailHog Web UI
      - "1025:1025" # SMTPサーバー
    networks:
      simulation1_network: # ネットワークをオブジェクト形式に変更
        ipv4_address: 172.22.0.6 # ★ 固定IPを割り当て

  # frontend_builderサービスは、NginxのDockerfileに統合されたため削除します。
  # frontend_builder: 
  #   image: nuxt_build_artifacts:latest
  #   build:
  #     context: .
  #     dockerfile: ./docker/nuxt/Dockerfile
  #     target: builder
  #   networks:
  #     simulation1_network:
  #       ipv4_address: 172.22.0.77

  frontend_dev: # ★ Nuxt 4 開発サーバー用サービス
    build:
      context: .
      dockerfile: ./docker/nuxt/Dockerfile
    volumes:
      - ./frontend:/app # Nuxtプロジェクトのソースコードをマウント
      - /app/node_modules # ★ 匿名ボリュームを追加して、ホスト側の node_modules の上書きをブロック
    ports:
      - "3000:3000"
    working_dir: /app
    # ★ 修正箇所：npm run dev の後に、ホストオプション '-- --host 0.0.0.0' を追加
    command: sh -c "VITE_FS_INOTIFY_LIMIT=524288 yarn dev --host 0.0.0.0 --port 3000 --https false"
    networks:
      simulation1_network:
        ipv4_address: 172.22.0.7

# ★ ネットワーク定義にIPアドレスのレンジ(サブネット)を追記
networks:
  simulation1_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24

volumes:
  mysql_data: ~
  caddy_data: {}
  caddy_config:
